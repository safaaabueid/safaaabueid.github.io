<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Safaa Abueid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Poppins', sans-serif; background: #fff; color: #222; }

  header { text-align: center; padding: 40px 20px 20px; }
  header .name { font-size: 22px; letter-spacing: 6px; font-weight: 500; color: #222; text-decoration: none; display: inline-block; margin-bottom: 30px; }
  nav ul { list-style: none; display: flex; justify-content: center; gap: 36px; flex-wrap: wrap; }
  nav a { text-decoration: none; color: #222; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; font-weight: 400; }
  nav a:hover, nav a.active { border-bottom: 1px solid #222; }

  .dropdown { position: relative; }
  .dropdown-menu { display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); background: #fff; padding: 14px 24px; min-width: 150px; box-shadow: 0 4px 16px rgba(0,0,0,.12); z-index: 10; }
  .dropdown:hover .dropdown-menu { display: block; }
  .dropdown-menu li { margin: 8px 0; text-align: center; }

  /* ---------- الفورم ---------- */
  h1 { text-align: center; font-weight: 300; font-size: 28px; letter-spacing: 4px; text-transform: uppercase; margin: 40px 0 40px; }
  form { max-width: 620px; margin: 0 auto 80px; padding: 0 24px; }
  .group-title { font-size: 15px; font-weight: 500; margin-bottom: 10px; }
  .row { display: flex; gap: 16px; margin-bottom: 24px; }
  .field { flex: 1; margin-bottom: 24px; }
  .row .field { margin-bottom: 0; }
  label { display: block; font-size: 14px; font-weight: 400; margin-bottom: 8px; }
  label small { color: #777; font-weight: 300; font-size: 12px; margin-left: 4px; }
  input, textarea { width: 100%; font-family: inherit; font-size: 15px; padding: 12px; border: 1px solid #222; border-radius: 0; background: #fff; color: #222; }
  input:focus, textarea:focus { outline: none; border-color: #000; box-shadow: 0 0 0 2px rgba(0,0,0,.12); }
  textarea { min-height: 160px; resize: vertical; }
  button { font-family: inherit; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; background: #222; color: #fff; border: none; padding: 14px 40px; cursor: pointer; }
  button:hover { background: #000; }
  .hidden { position: absolute; left: -9999px; }

  footer { text-align: center; padding: 30px; font-size: 12px; color: #999; border-top: 1px solid #eee; }

  @media (max-width: 600px) {
    nav ul { gap: 20px; }
    .row { flex-direction: column; gap: 24px; }
  }
</style>
</head>
<body>

<header>
  <a class="name" href="index.html">SAFAA ABUEID</a>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>

        <a href="#">Painting ▾</a>
        <ul class="dropdown-menu">

          <li><a href="portrait.html">Portrait</a></li>
          <li><a href="other.html">Other</a></li>
        </ul>
      </li>
      <li><a href="digital-art.html">Digital Art</a></li>
      <li><a href="info.html">Info</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>
</header>

<h1>Contact</h1>

<form action="https://formspree.io/f/xvkzyggy" method="POST">

  <div class="group-title">Name</div>
  <div class="row">
    <div class="field">
      <label for="first">First Name <small>(required)</small></label>
      <input type="text" id="first" name="first_name" required>
    </div>
    <div class="field">
      <label for="last">Last Name <small>(required)</small></label>
      <input type="text" id="last" name="last_name" required>
    </div>
  </div>

  <div class="field">
    <label for="email">Email <small>(required)</small></label>
    <input type="email" id="email" name="email" required>
  </div>

  <div class="field">
    <label for="details">Details <small>(required)</small></label>
    <textarea id="details" name="message" required></textarea>
  </div>

  <!-- حماية من الرسائل المزعجة -->
  <input type="text" name="_gotcha" class="hidden" tabindex="-1" autocomplete="off">

  <button type="submit">Send</button>
</form>

<footer>© 2026 Safaa Abueid</footer>

</body>
</html>
